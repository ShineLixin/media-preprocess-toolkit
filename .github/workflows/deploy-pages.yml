name: Deploy to GitHub Pages

# 纯前端离线产物构建（standalone）→ GitHub Pages
#
# 为什么要 MIAODA_BUILD_TARGET=standalone：
#   本项目的常规构建（scripts/build.sh）产物依赖秒搭平台运行时——HTML 里的
#   {{appName}} / {{appAvatar}} 占位符由 vefaas 运行时替换，并额外注入 slardar 埋点、
#   viewContext 与 AppContainer 水印。GitHub Pages 上没有这层运行时，直接用常规产物会出现
#   标题显示字面量 "{{appName}}"、favicon 指向平台占位符、外链脚本请求失败等问题。
#   standalone 是平台官方的「脱离平台可访问」构建目标：跳过上述注入，并把 BrowserRouter
#   换成 HashRouter（静态托管无需 404.html 回退，任意子路径可直接深链访问）。
#
# 为什么用 --base=./（相对路径资源）：
#   相对 base 让同一份产物既能跑在 https://<user>.github.io/<repo>/ 子路径，也能跑在
#   自定义域名根路径 —— index.html 里引用的是 ./assets/*.js、./favicon.svg，按文档 URL
#   相对解析。配合 standalone 的 HashRouter（路由在 # 之后、不改 pathname），深链下相对
#   路径依然正确。若写死绝对前缀（/media-preprocess-toolkit），绑定自定义域名后会全量 404。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --include=optional 必需：Rolldown 原生 binding 走 optionalDependencies，
      # 缺了会在构建期报 "Cannot find native binding"（npm/cli#4828）。
      - name: 安装依赖
        run: npm ci --include=optional

      - name: 类型检查
        run: npm run typecheck

      - name: 构建 Pages 离线产物
        env:
          NODE_ENV: production
          MIAODA_BUILD_TARGET: standalone
        run: npx vite build --outDir dist --emptyOutDir --base=./

      # 注：这里不挂 actions/configure-pages —— 本工作流不消费它输出的 base_url/base_path
      # （资源前缀用相对路径 --base=./）。而它的 enablement: true 在 GITHUB_TOKEN 下必然
      # 失败：action.yml 明确 "This option requires a token other than GITHUB_TOKEN"，
      # 创建 Pages 站点需要 PAT 的 repo 权限或 GitHub App 的 administration:write。
      # 因此 Pages 站点的启用改为一次性人工操作，见 DEPLOYMENT.md「首次部署前置条件」。

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 竞态护栏：若仓库 Settings → Pages 的发布来源是「Deploy from a branch」，每次 push 时
      # GitHub 还会额外跑内置的 pages build and deployment（Jekyll 构建 main 分支根目录），
      # 它与本工作流的 artifact 部署互相覆盖、以「后完成者」生效——曾导致线上被源码版
      # index.html 覆盖（/src/index.tsx 404、React 不挂载、站点白屏）。
      # 因此这里先等内置部署进入终态，再部署本工作流产物，保证产物始终最后生效。
      # 永久修复：在 Settings → Pages → Build and deployment → Source 切换为 "GitHub Actions"，
      # 内置分支构建不再触发，本步骤最多等待约 30 秒即放行（届时可删除本步骤）。
      - name: 等待内置分支构建部署完成（竞态护栏）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          PUSH_TS=$(jq -r '.head_commit.timestamp // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || true)
          if [ -z "$PUSH_TS" ]; then
            echo "非 push 事件（如手动触发），无需等待内置分支构建"
            exit 0
          fi
          PUSH=$(date -u -d "$PUSH_TS" +%s)
          api() {
            curl -s --max-time 15 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$1"
          }
          # 内置部署记录通常在 push 后约 25s 创建，而本步骤在构建完成后才运行，
          # 正常情况下首次查询即可发现；最多再等 30s 兜底。
          TARGET=""
          for _ in 1 2 3 4 5 6; do
            TARGET=$( (api "https://api.github.com/repos/$REPO/deployments?environment=github-pages&per_page=10" || echo '[]') \
              | jq -r --argjson p "$PUSH" '[.[] | select((.created_at | fromdateiso8601) > $p)][0].id // empty' 2>/dev/null || true)
            if [ -n "$TARGET" ]; then break; fi
            sleep 5
          done
          if [ -z "$TARGET" ]; then
            echo "未发现本次 push 触发的内置 Pages 部署（发布来源应已是 GitHub Actions），直接部署"
            exit 0
          fi
          echo "发现内置分支构建 deployment id=$TARGET，等待其进入终态…"
          for _ in $(seq 1 24); do
            STATE=$( (api "https://api.github.com/repos/$REPO/deployments/$TARGET/statuses?per_page=1" || echo '[]') \
              | jq -r '.[0].state // "unknown"' 2>/dev/null || true)
            echo "  内置部署 state=${STATE:-unknown}"
            case "${STATE:-}" in
              success|failure|error|inactive) break ;;
            esac
            sleep 10
          done
          echo "内置部署已结束，开始部署本工作流产物"

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
